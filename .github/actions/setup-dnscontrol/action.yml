name: Set up DNSControl
description: Download a pinned, checksum-verified DNSControl release onto PATH.

inputs:
  version:
    description: DNSControl version (without the leading "v").
    default: "5.7.1"
  sha256:
    description: SHA-256 of dnscontrol_<version>_linux_amd64.tar.gz.
    default: "6d2143af0453820b699da1ca8ae3f3e06ccbc0a912ea57f444b09d2f184736e9"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/dnscontrol"
        mkdir -p "$dir"
        tarball="dnscontrol_${VERSION}_linux_amd64.tar.gz"
        curl -sSfL -o "$dir/$tarball" \
          "https://github.com/StackExchange/dnscontrol/releases/download/v${VERSION}/${tarball}"
        echo "${SHA256}  $dir/$tarball" | sha256sum -c -
        tar -xzf "$dir/$tarball" -C "$dir" dnscontrol
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/dnscontrol" version
