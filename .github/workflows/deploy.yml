name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two pushes at once, and never cancel one mid-push.
concurrency:
  group: dnscontrol-deploy
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-dnscontrol

      - name: dnscontrol check
        run: dnscontrol check

      - name: dnscontrol push
        run: dnscontrol --no-colors push --no-populate
